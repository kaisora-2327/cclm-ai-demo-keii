<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>経緯検索編 デモ動画</title>
<style>
/* 動画を主役に、上に短い見出し・下に流れの要約。1カラム中央寄せ */
:root{
  --bg:#f3f6f6; --surface:#ffffff; --ink:#14262b; --sub:#5b6f73; --line:#d9e3e3; --teal:#0f7c78;
  --display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1719; --surface:#172225; --ink:#e4eeee; --sub:#9db0b3; --line:#2a3a3d; --teal:#3fb8b1; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1719; --surface:#172225; --ink:#e4eeee; --sub:#9db0b3; --line:#2a3a3d; --teal:#3fb8b1; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.7}
.wrap{max-width:1040px;margin:0 auto;padding:32px 16px 48px;display:grid;gap:20px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--teal);font-weight:700}
h1{font-family:var(--display);font-size:clamp(22px,3.2vw,30px);line-height:1.35;margin:4px 0 0;text-wrap:balance}
.lead{color:var(--sub);margin:6px 0 0;max-width:62ch}
video{width:100%;max-width:100%;aspect-ratio:16/9;display:block;border-radius:10px;border:1px solid var(--line);background:#000}
ol{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px}
ol li{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px}
ol li b{color:var(--teal);margin-right:6px;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--sub);margin:0}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700&family=Noto+Sans+JP:wght@400;700&display=swap">
<style>body{margin:0}</style></head><body>
<div class="wrap">
  <div>
    <div class="eyebrow">ContractS CLM × 生成AI 連携体験デモ</div>
    <h1>過去案件・経緯検索編（約40秒）</h1>
    <p class="lead">審査中の契約に似た過去案件をAIが探し、締結までの経緯を要約して、レビュータスクへ共有するまでの流れです。</p>
  </div>
  <video src="keii_demo_short.mp4" controls muted playsinline preload="metadata"></video>
  <ol>
    <li><b>1</b>きっかけ</li><li><b>2</b>類似案件の検索</li><li><b>3</b>経緯の参照</li><li><b>4</b>経緯の要約</li><li><b>5</b>タスクへ共有・完了</li>
  </ol>
  <p class="note">※ 企業名・契約書・データはすべて架空です。実際の製品画面・AI応答を簡略化しています。</p>
</div>
</body></html>
